<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="estilos.css">
        <title></title>
    </head>

    <body>
        <form id="formReg">

            <label for="nombreUsuario">Nombre:</label>
            <input type="text" id="nombreUsuario" placeholder="Escribe tu nombre">

            <label for="correoUsuario">Correo electrónico:</label>
            <input type="email" id="correoUsuario" placeholder="ejemplo@gmail.com">

            <label for="edadUsuario">Edad:</label>
            <input type="number" id="edadUsuario" placeholder="Ingresa tu edad">

            <button type="submit">Registrar usuario</button>
            <button type="button" id="botonCancelar" hidden>Cancelar edición</button>

        </form>

        <h2>Usuarios registrados</h2>
        <ul id="listaUsuarios"></ul>

        <script src="script.js"></script>
    </body>
</html>
